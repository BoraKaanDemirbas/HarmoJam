<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarmoJam Admin Dashboard</title>
    <!-- Chart.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* HarmoJam Karanlık/Mor Tema */
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff7eb3;
            text-shadow: 0 0 10px rgba(255, 126, 179, 0.5);
            margin-bottom: 30px;
        }
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: linear-gradient(135deg, #2d2a4a 0%, #1f1d36 100%);
            border: 1px solid #ff7eb3;
            border-radius: 15px;
            padding: 25px 40px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            min-width: 150px;
        }
        .stat-card h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #a29bfe;
        }
        .stat-card p {
            margin: 10px 0 0 0;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff7eb3;
        }
        .chart-container {
            background-color: #1f1d36;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            border: 1px solid #3d3b5a;
            height: 260px;
            box-sizing: border-box;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 95%;
            max-width: 1300px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>HarmoJam Admin Dashboard</h1>

<!-- Özet İstatistik Kartları -->
<div class="stats-container">
    <div class="stat-card">
        <h3>Total Searches</h3>
        <p id="totalSearchesLoading">...</p>
    </div>
    <div class="stat-card">
        <h3>Total Favorites</h3>
        <p id="totalFavoritesLoading">...</p>
    </div>
    <div class="stat-card">
        <h3>Total Mixes</h3>
        <p id="totalMixesLoading">...</p>
    </div>
</div>


<!-- 5 İstatistik Grafiği - 3 sütunlu grid düzeni -->
<div class="charts-grid">
    <div class="chart-container">
        <canvas id="topSearchesChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="topMixedChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="topAddedChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="topRemovedChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="topPlayedChart"></canvas>
    </div>

</div>

<script>
    // Sayfa yüklendiğinde verileri Backend'den çek
    document.addEventListener("DOMContentLoaded", () => {
        fetch('/api/admin/stats')
            .then(response => response.json())
            .then(data => {
                // 1. Kartları Doldur

                document.getElementById('totalMixesLoading').innerText = data.totalMixes;
                document.getElementById('totalSearchesLoading').innerText = data.totalSearches;
                document.getElementById('totalFavoritesLoading').innerText = data.totalFavorites;

                // 2. Grafik için verileri hazırla (Backend'den Object[] dizisi olarak geliyor)
                const topSearches = data.topSearches;
                const labels = topSearches.map(item => item[0]); // Kelimeler
                const counts = topSearches.map(item => item[1]); // Aratılma sayıları

                // 3. Chart.js Grafiğini Çiz
                const ctx = document.getElementById('topSearchesChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar', // Sütun grafiği
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Number of Searches',
                            data: counts,
                            backgroundColor: 'rgba(255, 126, 179, 0.6)',
                            borderColor: 'rgba(255, 126, 179, 1)',
                            borderWidth: 1,
                            borderRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#ffffff' }
                            },
                            title: {
                                display: true,
                                text: 'Top 5 Most Searched Terms',
                                color: '#a29bfe',
                                font: { size: 18 }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { color: '#ffffff', stepSize: 1 },
                                grid: { color: 'rgba(255,255,255,0.1)' }
                            },
                            x: {
                                ticks: { color: '#ffffff' },
                                grid: { color: 'rgba(255,255,255,0.1)' }
                            }
                        }
                    }
                });

                // 4. Diğer top-5 istatistik grafiklerini çiz (aynı Object[] [isim, sarkici, count] formatı)
                function renderTopSongChart(canvasId, items, chartLabel, chartColor) {
                    const labels = items.map(item => `${item[0]} - ${item[1]}`); // isim - sarkici
                    const counts = items.map(item => item[2]);

                    new Chart(document.getElementById(canvasId).getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: chartLabel,
                                data: counts,
                                backgroundColor: chartColor.bg,
                                borderColor: chartColor.border,
                                borderWidth: 1,
                                borderRadius: 5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            indexAxis: 'y',
                            plugins: {
                                legend: { labels: { color: '#ffffff' } },
                                title: { display: true, text: chartLabel, color: '#a29bfe', font: { size: 18 } }
                            },
                            scales: {
                                x: {
                                    beginAtZero: true,
                                    ticks: { color: '#ffffff', stepSize: 1 },
                                    grid: { color: 'rgba(255,255,255,0.1)' }
                                },
                                y: {
                                    ticks: { color: '#ffffff' },
                                    grid: { color: 'rgba(255,255,255,0.1)' }
                                }
                            }
                        }
                    });
                }

                renderTopSongChart('topMixedChart', data.topMixed, 'Most Mixed Songs',
                    { bg: 'rgba(162, 155, 254, 0.6)', border: 'rgba(162, 155, 254, 1)' });

                renderTopSongChart('topAddedChart', data.topAddedFavorites, 'Most Added to Favorites',
                    { bg: 'rgba(0, 230, 118, 0.6)', border: 'rgba(0, 230, 118, 1)' });

                renderTopSongChart('topRemovedChart', data.topRemovedFavorites, 'Most Removed from Favorites',
                    { bg: 'rgba(255, 82, 82, 0.6)', border: 'rgba(255, 82, 82, 1)' });

                renderTopSongChart('topPlayedChart', data.topPlayed, 'Most Played Previews',
                    { bg: 'rgba(255, 196, 0, 0.6)', border: 'rgba(255, 196, 0, 1)' });
            })
            .catch(error => {
                console.error("İstatistikler çekilirken hata oluştu:", error);
                document.getElementById('totalSearchesLoading').innerText = "Err";
                document.getElementById('totalFavoritesLoading').innerText = "Err";
            });
    });
</script>
</body>
</html>
