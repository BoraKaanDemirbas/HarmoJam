<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarmoJam</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="wave"></div><div class="wave"></div>
<div class="glow glow-1"></div><div class="glow glow-2"></div>
<div class="noise"></div>

<div class="content-wrapper">
    <h1 style="cursor: pointer;" onclick="resetToHome()">HarmoJam</h1>

    <div class="nav-menu">
        <button onclick="showSearch()" class="nav-btn active" id="btn-search">Search</button>
        <button onclick="showFavorites()" class="nav-btn" id="btn-fav">Favorites</button>
        <button onclick="showAccount()" class="nav-btn" id="btn-account">Account</button>
    </div>

    <div id="search-view">
        <div class="search-container-outer">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Search artists, tracks..." autocomplete="off"/>
                <button class="search-btn" id="searchBtn" onclick="performSearch()">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>

            <div id="historyContainer" class="history-container">
            </div>
        </div>

        <p class="tagline" id="statusText">Discover the rhythm of the universe...</p>
        <div class="results-area" id="resultsArea"></div>
    </div>

    <div id="favorites-view">
        <div class="playlist-bar" id="playlistBar"></div>

        <div class="search-box fav-search-box">
            <input id="favSearchInput" type="text" placeholder="Search in this list..." oninput="filterFavoritesView()" autocomplete="off"/>
        </div>

        <div class="results-area" id="favoritesArea">
            <p style="opacity: 0.5;">Loading...</p>
        </div>
    </div>

    <div id="account-view" style="display:none; width:100%; flex-direction:column; align-items:center;">
        <div id="accountLoggedOut" style="width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; gap:12px;">
            <div class="search-box" style="max-width:400px;">
                <input id="authUsername" type="text" placeholder="Username" autocomplete="username"/>
            </div>
            <div class="search-box" style="max-width:400px;">
                <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password"/>
            </div>
            <div style="display:flex; gap:10px; width:100%; max-width:400px;">
                <button onclick="doLogin()" class="action-btn recommend-btn" style="flex:1; padding:12px;">Login</button>
                <button onclick="doRegister()" class="action-btn play-btn" style="flex:1; padding:12px;">Register</button>
            </div>
            <p id="authError" style="color:#ff6b6b; font-size:0.9rem; min-height:1.2em;"></p>
        </div>

        <div id="accountLoggedIn" style="display:none; flex-direction:column; align-items:center; gap:16px;">
            <p style="font-size:1.2rem;">Logged in as <strong id="accountUsername"></strong></p>
            <button onclick="doLogout()" class="action-btn play-btn" style="padding:10px 30px;">Logout</button>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
